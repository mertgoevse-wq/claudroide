android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# ── Speichergrenze für den Bau auf dem Galaxy A56 ─────────────────────────────
# Gemessen am 2026-10-03 auf dem Zielgerät (Termux/Debian/PRoot auf SM-A566B):
#   vor dem Bau                 1551 MB frei
#   Spitze inkl. Gradle + Daemon   6493 MB belegt, nur 994 MB frei
# Der frühere Wert -Xmx2048m galt für einen Rechner, nicht für ein Telefon.
# Gradle holt dieses Limit, bevor es aufräumt; das Gerät weicht dann in den Swap
# aus, und der Prozess wird gekillt. Genau das sind die Abstürze in Termux.
#
# Gradle und Kotlin-Daemon sind jetzt EIN Pool statt zwei: "in-process" startet
# den Compiler im Gradle-JVM. Vorher lief der Daemon als eigener JVM mit dem
# Default-Limit 1/4 des physischen RAMs und wurde mit 1264 MB RSS gemessen.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process

# Ein Worker statt acht: acht gleichzeitige Compiler-Prozesse vervielfachen den
# Spitzenbedarf. Auf dem A56 überwiegt die Zeitersparnis den Speicherverlust.
org.gradle.workers.max=1

# Daemons abschalten: nach einem Absturz bleibt sonst ein JVM zurück, das den
# nächsten Bau am Limit festhält. Auf dem A56 hat die Sitzung 10 solche Reste
# hinterlassen (./gradlew --status zeigte 10x STOPPED).
org.gradle.daemon=false
org.gradle.vfs.watch=false
