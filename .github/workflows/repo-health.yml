name: repo-health

on:
  push:
    branches: [feat/claudroide-next-architecture]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    name: Task frontmatter, assets, checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Task frontmatter (135 tasks, waves, skills, status)
        run: python3 tools/sync_frontmatter.py --check

      - name: No SVG as a finished logo or illustration
        run: |
          if compgen -G "assets/*.svg" > /dev/null; then
            echo "::error::SVG in assets/ — finished graphics are PNG, WebP or JPG only (see CLAUDE.md)."
            exit 1
          fi

      - name: Checkpoint present
        run: |
          test -s progress/BUILD-STATE.md || { echo "::error::progress/BUILD-STATE.md is missing or empty."; exit 1; }

      - name: Gradle wrapper is the published one
        uses: gradle/actions/wrapper-validation@v5

  secrets:
    name: No keys in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # The decision logic lives in tools/secret_gate.py: a key prefix alone is
      # not a finding, it needs a random-looking segment next to it.
      - name: Scan for real key patterns
        run: python3 tools/secret_gate.py .

      # A filter that finds nothing proves nothing, so it must find the planted
      # keys in tools/secret_gate_fixtures/ (Anthropic, GitHub, PEM body).
      - name: "Counter-check: the filter catches planted keys"
        run: |
          set -euo pipefail
          if python3 tools/secret_gate.py tools/secret_gate_fixtures; then
            echo "::error::The key filter did NOT catch the planted keys; it is broken."
            exit 1
          fi
          echo "Counter-check passed: planted keys are detected."

      - name: app/src/main holds no key-shaped literal
        run: |
          set -euo pipefail
          # One documented masking example lives in AppSettings.kt; it is
          # named here instead of being skipped silently.
          if grep -rInE 'sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' app/src/main/ \
             | grep -v 'AppSettings.kt'; then
            echo "::error::Key-shaped literal in app/src/main."
            exit 1
          fi
